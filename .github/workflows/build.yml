name: build

# The release gate. Two things are checked, and the second is the one that matters:
# that the validator passes, and that the committed output is byte-identical to a fresh
# build. Without the second, the published tree can drift from its source and every
# other check stays green while it does.

on:
  push:
    branches: [dev, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate
        run: python3 admin/build/build_pages.py

      - name: Validate
        run: node admin/build/validate.js

      - name: The committed tree must match a fresh build
        run: |
          if ! git diff --quiet; then
            echo "::error::The published tree is stale — regenerate and commit:"
            echo "::error::  python3 admin/build/build_pages.py && node admin/build/validate.js"
            git diff --stat
            git diff
            exit 1
          fi
          echo "output matches source"
